<!doctype html>
<html><head><meta charset="utf-8"><title>Kitty Cat Run art gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#fdeef4}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../art.js"></script>
<script>
// Every cat in every pose, the mice, the dog, the vacuum, the ball and the room things, drawn big.
// ?t=1.3 sets the animation time.
const c = document.getElementById('c'), g = c.getContext('2d');
const S = 5, W = 260, H = 200;
c.width = W * S; c.height = H * S;
const t = +(new URLSearchParams(location.search).get('t') || 0.4);
g.scale(S, S);
const poses = [
  { mode: 'stand', face: 1 }, { mode: 'walk', face: 1, walk: 1 }, { mode: 'walk', face: -1, walk: 2.4 },
  { mode: 'fly', face: 1 }, { mode: 'jump', face: 1 }, { mode: 'climb', walk: 1 },
  { mode: 'stand', face: 1, swipe: 'fwd', swipeK: 0.5 }, { mode: 'stand', face: 1, swipe: 'up', swipeK: 0.5 },
  { mode: 'walk', face: 1, walk: 3, happy: true },
];
CATS.forEach((P, i) => poses.forEach((s, j) => drawCat(g, 6 + j * 16, 4 + i * 16, P, s, t)));
drawCatScared(g, 6 + 9 * 16, 4, CATS[0], 0.3, t, 1);
drawCatScared(g, 6 + 10 * 16, 4, CATS[0], 0.7, t, 1);
MICE.forEach((M, i) => drawMouseHome(g, 160 + (i % 5) * 20, 30 + Math.floor(i / 5) * 26, M, i < 5 ? 'sleep' : 'awake', 1, t));
drawMouseHome(g, 160, 82, MICE[2], 'waking', 0.2, t);
drawMouseHome(g, 184, 82, MICE[3], 'happy', 1, t);
['run', 'sit', 'climb', 'fall'].forEach((p, i) => drawDog(g, 160 + i * 16, 112, 1, p, 1, t));
drawVacuum(g, 224, 112, 1, t, false);
drawVacuum(g, 240, 112, -1, t, true);
[12, 13, 15].forEach((f, i) => drawBall(g, 160 + i * 16, 128, f, t));
const th = THEMES[0];
const items = [4, 15, 16, 19, 20, 21, 22, 23, 6, 7, 8, 33, 34, 38, 70, 115, 118];
items.forEach((v, i) => drawTile(g, v, 160 + (i % 8) * 13, 146 + Math.floor(i / 8) * 14, i, 0, t, () => 0, th, [false, true]));
drawPost(g, 230, 128, (dx, dy) => (dy < 0 ? 0 : 60));
drawWater(g, 244, 128, 0, true, (dx, dy) => (dy < 0 ? 0 : 74));
drawWater(g, 244, 140, 0, true, (dx, dy) => (dy < 0 ? 74 : 60));
drawWater(g, 230, 160, 1, false, () => 0);
drawPickup(g, 0, 244, 160, t, false);
drawBubble(g, 230, 180, t, false); drawCat(g, 230, 180, CATS[9], { mode: 'stand', face: 1 }, t);
drawBoxKnocked(g, 244, 180, 0.4, 2);
</script></body></html>
